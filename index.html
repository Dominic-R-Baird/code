<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="icon" href="images/logo_card_image.png" type="image/x-icon" >
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CarefreeCards.com</title>
    <link rel="stylesheet" href="style.css">
    <script src="pop-up.js" defer></script>
</head>
<body>
    <div class="container">
        <div id="modal">
            <div class="modalcontent">
                <button id="close-form">X</button>
                <iframe src="https://docs.google.com/forms/d/e/1FAIpQLScvHuwEEh1YDRuY-b7L3Yw40M72NSxSW4InsXQybSyeMZY7VA/viewform" width="640" height="695" frameborder="0" marginheight="0" marginwidth="0">Loading…</iframe>
            </div>
        </div>
    </div>
    <header class="utility_bar">
        
        <div popover id="my-popover-div">
            <button><a href="index.html">Home</a></button>
            <button popovertarget="my-popover-div" popovertargetaction="hide" id="get-to-know-you">Get to know you</button>
            <button popovertarget="my-popover-div" popovertargetaction="hide">Close</button>
        </div>

        <button class="invisible-button" popovertarget="my-popover-div">
            <div class="logo"><img id="logo_image" src="images/logo_card_image.png"></div>  
        </button>
        <h1 class="h1">Find out all you need to know about new releases and what we have up on this website</h1>
    </header>


    <header class="products_nav">
        <div><a href="one-piece.html"><img id="product_image" src="images/one_piece_card_game.webp" class="product_image"/></a></div>
        <div><a href="magic.html"><img id="product_image" src="images/mtg-logo.webp" class="product_image"/></a></div>
        <div><a href="pokemon.html"><img id="product_image" src="images/pokemon-trading-card-game.png" class="product_image"/></a></div>  
        <div><a href="yu-gi-oh.html"><img id="product_image" src="images/yu-gi-oh.jpg" class="product_image"/></a></div>
    </header>

    <main class="nrelease_bar">
        <div><img id="product_image" src="images/new_releases.png" class="nrelease-img"/></div>
        <div class="item-card">
            <img src="images/mtg_hobbit.jpg" class="item-images"/>
            <div class="item-details">
                <h3>MTG Play Booster - The Hobbit</h3>
            </div>
        </div>
        <div class="item-card">
            <img src="images/pokemon_ delta_reign.webp" class="item-images"/>
            <div class="item-details">
                <h3>Pokemon Booster Box - Delta Reign</h3>
            </div>
        </div>
        <div class="item-card">
            <img src="images/op17.jpg" class="item-images"/>
            <div class="item-details">
                <h3> One Piece Booster Box - The World's Strongest Warriors</h3>
            </div>
        </div>
    </main>

</body>
</html>
