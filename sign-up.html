<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="icon" href="images/logo_card_image.png" type="image/x-icon" >
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CarefreeCards.com</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="utility_bar">
        <div>
            <a href="index.html"> <img id="logo_image" src="images/logo_card_image.png" class="logo"/></a>
        </div>
        <div>
            <form action="/search" method="GET" class="search-form">
                <input 
                    type="search" 
                    name="q" 
                    placeholder="Search..." 
                    aria-label="Search"
                    required
                >
                <button type="submit">Search</button>
            </form>
        </div>
        <div><a href="index.html"> <img id="profile_image" src="images/profile_icon.png" class="logo"/></a></div>
        <div><a href="index.html"> <img id="cart_image" src="images/shopping cart.png" class="logo"/></a></div>
    </header>
    
</body>
</html>
